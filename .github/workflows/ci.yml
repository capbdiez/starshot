name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (typecheck, lint, deps, test, assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm test
      - run: npm run check:assets
      - run: npm run release:check
      - name: Committed atlas is up to date with content/ and tools/art
        run: |
          npm run assets:art
          npm run assets:atlas
          npm run assets:sfx
          npm run assets:music
          git diff --exit-code -- assets/ || {
            echo "::error::assets/ is stale. Run 'npm run assets:build' and commit the result."
            exit 1
          }
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E smoke (Chromium + WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
